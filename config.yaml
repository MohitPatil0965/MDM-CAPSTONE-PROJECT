# ==============================================================================
# AI-Driven Multi-Objective Campaign Optimization System Configuration
# ==============================================================================

# Global reproducibility seed
seed: 42

# ------------------------------------------------------------------------------
# Data Paths & Settings
# ------------------------------------------------------------------------------
data:
  raw_path: "data/raw/marketing_campaign.xlsx"
  processed_train_path: "data/processed/train.parquet"
  processed_test_path: "data/processed/test.parquet"
  processed_full_path: "data/processed/full_cleaned.parquet"
  test_size: 0.20
  
  # Data cleaning filter thresholds
  min_year_birth: 1920
  max_income: 200000

# ------------------------------------------------------------------------------
# Economic & Business Parameters (Labeled Assumptions)
# ------------------------------------------------------------------------------
economics:
  # Base dataset parameters (derived from constant columns in original data)
  cost_per_contact_base: 3.0       # [Assumption/Data] Cost per contact base baseline (Z_CostContact)
  revenue_per_conversion: 11.0     # [Assumption/Data] Revenue generated per successful conversion (Z_Revenue)

  # Customer Lifetime Value (CLV) proxy formula parameters
  # Formula: CLV_i = (Total_Spend_i / max(tenure_months_i, 1)) * expected_lifetime_months * margin
  clv:
    expected_lifetime_months: 24   # [Assumption] Expected customer relationship horizon in months
    margin: 0.30                   # [Assumption] Operating profit margin on customer spend

  # Marketing Channel Assumptions
  # Synthetic assumptions as dataset lacks channel-specific granular logs
  channels:
    email:
      name: "Email"
      cost_per_contact: 0.5        # [Assumption] Unit cost per email contact
      response_multiplier: 0.8     # [Assumption] Relative response lift relative to baseline
    sms:
      name: "SMS/Push"
      cost_per_contact: 1.0        # [Assumption] Unit cost per SMS message
      response_multiplier: 0.9     # [Assumption] Relative response lift relative to baseline
    direct_mail:
      name: "Direct Mail"
      cost_per_contact: 3.0        # [Assumption] Unit cost per postal mail
      response_multiplier: 1.0     # [Assumption] Benchmark response multiplier
    phone:
      name: "Phone Call"
      cost_per_contact: 5.0        # [Assumption] Unit cost per telemarketing call
      response_multiplier: 1.2     # [Assumption] High-touch response lift multiplier

# ------------------------------------------------------------------------------
# Customer Segmentation (K-Means)
# ------------------------------------------------------------------------------
segmentation:
  features:
    - "Income"
    - "Total_Spend"
    - "Total_Purchases"
    - "Recency"
    - "NumWebVisitsMonth"
    - "Age"
  k_min: 3
  k_max: 6
  k_override: null                 # If null, automatically selects K with highest silhouette score
  default_k: 4

# ------------------------------------------------------------------------------
# Predictive Modeling (LightGBM & Baselines)
# ------------------------------------------------------------------------------
model:
  target: "Response"
  cv_folds: 5
  early_stopping_rounds: 30
  overfitting_gap_threshold: 0.07  # Flag warning if Train AUC - Held-out Test AUC > 0.07
  
  # Optuna hyperparameter search bounds (constrained to shallow trees to prevent overfitting)
  optuna:
    n_trials: 40
    timeout: 120
    search_space:
      num_leaves: [4, 16]
      max_depth: [2, 5]
      min_child_samples: [20, 60]
      learning_rate: [0.01, 0.08]
      subsample: [0.6, 0.9]
      colsample_bytree: [0.5, 0.8]
      reg_alpha: [0.1, 5.0]
      reg_lambda: [1.0, 10.0]

  # Default robust baseline parameters
  lightgbm_default:
    n_estimators: 400
    learning_rate: 0.03
    num_leaves: 8
    max_depth: 4
    min_child_samples: 30
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.7
    reg_alpha: 1.0
    reg_lambda: 5.0
    random_state: 42
    verbose: -1

# ------------------------------------------------------------------------------
# Multi-Objective Optimization (NSGA-II)
# ------------------------------------------------------------------------------
optimizer:
  population_size: 100
  n_generations: 200
  crossover_eta: 15
  crossover_prob: 0.9
  mutation_eta: 20
  seeds: [42, 101, 202, 303, 404]
  
  # Budget constraints
  budget_min_fraction: 0.10
  budget_max_fraction: 1.00
  default_max_budget: 5000.0       # Total campaign budget pool ($)
  
  # Objectives: f1 = -CLV gain, f2 = -ROI, f3 = Cost, f4 = Fatigue (optional)
  include_fatigue_objective: false
  fatigue_penalty_weight: 0.05     # [Assumption] Penalty if multiple channels exceed segment size

  # TOPSIS default preference weights: [CLV, ROI, Cost]
  default_topsis_weights: [0.4, 0.4, 0.2]

# ------------------------------------------------------------------------------
# Output Paths
# ------------------------------------------------------------------------------
reports:
  figures_dir: "reports/figures"
  tables_dir: "reports/tables"
  paper_numbers_file: "reports/paper_numbers.md"
